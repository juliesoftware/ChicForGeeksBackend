# ENUMS
enum ActionTaken {
  ACCEPTED
  DECLINED
}

enum MealType {
  BREAKFAST
  LUNCH
  DINNER
  SNACK
}

enum WorkoutIntensity {
  LOW
  MEDIUM
  HIGH
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

# INPUTS
input UserInput {
  name: String!
  email: String!
  password: String!
  age: Int
  gender: Gender
  goals: String
  preferredWorkoutTimes: [String]
  chatEnabled: Boolean
}

input MealPlanInput {
  name: String!
  type: MealType
  description: String
  calories: Int
  proteins: Int
  fats: Int
  carbs: Int
}

input WorkoutPlanInput {
  name: String!
  description: String
  intensity: WorkoutIntensity
  durationMinutes: Int
  exercises: [ExerciseInput]
}

input ExerciseInput {
  name: String!
  repetitions: Int!
  sets: Int!
}

input ChatInput {
  message: String!
  senderId: String!
  receiverId: String!
}

# TYPES
type User {
  id: String!
  name: String!
  email: String!
  age: Int
  gender: Gender
  goals: String
  mealPlans: [MealPlan]
  workoutPlans: [WorkoutPlan]
  chatEnabled: Boolean
}

type MealPlan {
  mealPlanId: String!
  userId: String!
  name: String!
  type: MealType
  description: String
  date: String!
  calories: Int
  proteins: Int
  fats: Int
  carbs: Int
}

type WorkoutPlan {
  id: String!
  name: String!
  description: String
  intensity: WorkoutIntensity
  durationMinutes: Int
  exercises: [Exercise]
}

type Exercise {
  name: String!
  repetitions: Int!
  sets: Int!
}

type Chat {
  id: String!
  message: String!
  sender: User!
  receiver: User!
  timestamp: String!
}

# MUTATIONS
type Mutation {
  createUser(userInput: UserInput!): User
  createMealPlan(userId: String!, mealPlanInput: MealPlanInput!): MealPlan
  createWorkoutPlan(userId: String!, workoutPlanInput: WorkoutPlanInput!): WorkoutPlan
  sendMessage(chatInput: ChatInput!): Chat
}

# QUERIES
type Query {
  getUser(userId: String!): User
  getMealPlans(userId: String!): [MealPlan]!
  getWorkoutPlans(userId: String!): [WorkoutPlan]
  getChatHistory(senderId: String!, receiverId: String!): [Chat]
}

schema {
  query: Query
  mutation: Mutation
}